services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: sql-linux-lab-web
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
